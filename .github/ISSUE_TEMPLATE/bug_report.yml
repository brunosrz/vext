name: Bug Report
description: Something isn't working correctly
labels: ["bug", "needs-triage"]
assignees: ["brunosoares"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the SDK or extension where you saw the problem
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - TypeScript SDK
        - Python SDK
        - Official extension
        - Manifest / schemas
        - JSON-RPC protocol
        - Packaging (.vext)
        - Other
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime and Vectora version
      description: Node.js or Python version, and the Vectora app version hosting the extension
      placeholder: "Node 22.11, Vectora 0.3.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what's happening
      placeholder: "When I do X, Y happens instead of Z"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Declare `...` in `vectora-extension.json`
        2. Call `...` from the extension (no real secrets)
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant logs (remove any tokens or personal data)
      render: shell
