name: Vext

# Valida o SDK TypeScript, o SDK Python e as extensões em todo PR e, quando o
# commit que chega ao master é o de release (`chore(master): release X`),
# publica os pacotes: o SDK TypeScript no npm, com proveniência, e o SDK Python
# no PyPI quando a variável PUBLISH_PYPI do repositório está como `true`. Só
# depois de a publicação passar o job final cria a tag e a GitHub Release e
# dispara, por workflow_dispatch, a rotação das linhas de release e o
# release-please.yml (tags e releases criadas com o GITHUB_TOKEN não iniciam
# outros workflows).
#
# Os dois SDKs saem sempre na mesma versão. O bootstrap 0.0.1 não contém API
# utilizável. A publicação usa OIDC no PyPI e proveniência no npm; NPM_TOKEN
# pode ser necessário para criar o primeiro pacote npm.

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: vext-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  verify:
    name: Verify TypeScript (types + tests + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Validate extension manifests
        run: pnpm run --if-present validate:manifests

  verify-python:
    name: Verify Python (SDK + tooling)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: .
      - name: Tests
        run: uv run pytest
      - name: Build the Python SDK
        if: hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: uv build

  publish-npm:
    name: Publish TypeScript SDK (npm)
    needs: [verify, verify-python]
    # workflow_dispatch permite publicar o bootstrap a partir de master; uma
    # execução manual em outra branch nunca publica.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'chore(master): release ')))
    runs-on: ubuntu-24.04
    # Os publishers e segredos de release usam o Environment único.
    environment: production
    concurrency:
      group: vext-publish-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Verify SDK versions match
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p "require('./packages/sdk/package.json').version")"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          test "$npm_version" = "$python_version" || {
            echo "SDK versions diverge: npm=$npm_version PyPI=$python_version" >&2
            exit 1
          }
      - name: Publish TypeScript SDK with provenance
        env:
          # Sem NPM_TOKEN o npm autentica por trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/vext-sdk-pack"
          mkdir -p "$pack_dir"
          pnpm --filter @vext/sdk pack --pack-destination "$pack_dir"
          shopt -s nullglob
          archives=("$pack_dir"/*.tgz)
          test "${#archives[@]}" -eq 1 || {
            echo "Expected exactly one @vext/sdk package archive, found ${#archives[@]}" >&2
            exit 1
          }
          npm publish "${archives[0]}" --access public --provenance

  publish-pypi:
    name: Publish Python SDK (PyPI)
    needs: [publish-npm]
    if: >-
      vars.PUBLISH_PYPI == 'true' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'chore(master): release ')))
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: vext-publish-pypi
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: .
      - name: Build the Python SDK
        working-directory: python
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        working-directory: python
        run: uv publish --trusted-publishing always

  tag-release:
    name: Tag and publish release
    needs: [publish-npm, publish-pypi]
    # O PyPI é opcional: só a publicação no npm é obrigatória para a tag sair.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'chore(master): release '))) &&
      needs.publish-npm.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.publish-pypi.result)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # As credenciais permanecem no remote para o `git push` da tag
          # autenticar com contents: write.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Read released version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/package.json').version")"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create tag after successful publish
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "Vext $VERSION"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release, rotate release lines and prepare the next release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Vext $VERSION" \
              --generate-notes
          fi
          gh workflow run rotate-release-lines.yml \
            --repo "$GITHUB_REPOSITORY" --ref master \
            --field "release_tag=$TAG" --field "target_branch=master"
          gh workflow run release-please.yml \
            --repo "$GITHUB_REPOSITORY" --ref master
